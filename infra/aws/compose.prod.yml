# EC2-дегі стек (#68, #86, #88): Caddy (HTTPS) → production (app + db) және development (app-dev + db-dev),
# OpenTelemetry collector (ADOT) → X-Ray, CloudWatch Metrics, CloudWatch Logs.
# Мәндер /opt/debug/.env-тен (құпиялар серверде жасалған). Файлды infra/aws/deploy.sh әр деплойда жаңартады.
name: debug

x-app: &app
  restart: unless-stopped
  depends_on:
    otel:
      condition: service_started

services:
  # ---------------- production ----------------
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: debug
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d debug"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app:
    <<: *app
    image: ${APP_IMAGE:?}
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://debug:${POSTGRES_PASSWORD:?}@db:5432/debug
      SESSION_SECRET: ${SESSION_SECRET:?}
      SEED_ON_START: "0"
      DEPLOY_ENV: production
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_TRACES_SAMPLER_ARG: "0.2"
      NODE_OPTIONS: --max-old-space-size=300
    depends_on:
      db:
        condition: service_healthy
      otel:
        condition: service_started

  # ---------------- development (бөлек дерекқор, бөлек құпиялар) ----------------
  db-dev:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    environment:
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:?}
      POSTGRES_DB: debug
    volumes:
      - /data/postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d debug"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  app-dev:
    <<: *app
    image: ${APP_IMAGE_DEV:-${APP_IMAGE}}
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://debug:${DEV_POSTGRES_PASSWORD:?}@db-dev:5432/debug
      SESSION_SECRET: ${DEV_SESSION_SECRET:?}
      SEED_ON_START: "1"
      DEPLOY_ENV: development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      OTEL_TRACES_SAMPLER_ARG: "1"
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      db-dev:
        condition: service_healthy
      otel:
        condition: service_started

  # ---------------- observability ----------------
  otel:
    image: public.ecr.aws/aws-observability/aws-otel-collector:v0.51.0
    command: ["--config=/etc/otel-collector.yaml"]
    environment:
      AWS_REGION: ${AWS_REGION:?}
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    restart: unless-stopped
    # Порт сыртқа ашылмайды: тек app/app-dev осы желіде OTLP жібереді

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - app-dev
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
