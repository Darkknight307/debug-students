# Өндірістік стек EC2-де (#68): Caddy (HTTPS, <ip>.sslip.io) → app (ECR-дегі бейне) → PostgreSQL (/data — бөлек EBS томы).
# Мәндер /opt/debug/.env-тен: құпиялар серверде жасалған (stack.yml UserData). Файлды infra/aws/deploy.sh әр деплойда жаңартады.
name: debug

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: debug
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: debug
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debug -d debug"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    # Порт сыртқа ашылмайды: дерекқорға тек осы желідегі app қосылады

  app:
    image: ${APP_IMAGE:?}
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://debug:${POSTGRES_PASSWORD:?}@db:5432/debug
      SESSION_SECRET: ${SESSION_SECRET:?}
      SEED_ON_START: "0"
      # t3.micro: 1 ГБ жад + 2 ГБ swap
      NODE_OPTIONS: --max-old-space-size=320
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
