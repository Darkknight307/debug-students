# OpenTelemetry Collector (ADOT, #88): app/app-dev → OTLP/HTTP → X-Ray (traces), CloudWatch EMF (metrics),
# CloudWatch Logs (logs). Креденшиалдар — EC2 instance role (IMDSv2). Тегін шек: 5 метрика × 2 орта = 10 ағын.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 96
    spike_limit_mib: 24
  batch:
    timeout: 10s

exporters:
  awsxray:
    region: ${env:AWS_REGION}
    indexed_attributes: [deployment.environment, http.status_code, next.route]
  awsemf:
    region: ${env:AWS_REGION}
    namespace: DebugStudents
    log_group_name: /debug-students/metrics
    log_stream_name: emf
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      enabled: false
    metric_declarations:
      # Тек осы бес метрика, тек `env` өлшемімен — CloudWatch-та 10 метрика ағыны (тегін шек)
      - dimensions: [[env]]
        metric_name_selectors: ["^http_latency$", "^http_5xx$", "^registrations$", "^submissions$", "^login_failures$"]
  awscloudwatchlogs:
    region: ${env:AWS_REGION}
    log_group_name: /debug-students/app
    log_stream_name: app

service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [awscloudwatchlogs]
